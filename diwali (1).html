<title>Diwali Night – A Celebration</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Hind:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--ink:#fff3dc;--mute:#e3cfae;--flame:#ffb703;--ember:#ff6b35;--line:rgba(255,190,90,.35)}
*{box-sizing:border-box}
html,body{height:100%;height:100dvh;margin:0;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none;background:#06040c;color:var(--ink);font-family:"Hind","Segoe UI",system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;height:100dvh;touch-action:manipulation;display:block;cursor:pointer}
.panel{position:fixed;left:0;right:0;bottom:0;padding:70px calc(18px + env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) calc(18px + env(safe-area-inset-left,0px));text-align:center;background:linear-gradient(#06040c00,#06040cea 55%);pointer-events:none}
.panel>*{pointer-events:auto}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(2rem,7vw,3.2rem);letter-spacing:.02em;color:#ffc65a;margin:0;text-shadow:0 0 24px rgba(255,140,40,.55);animation:in 1s both}
p{max-width:34em;margin:6px auto 14px;color:var(--mute);font-size:clamp(.95rem,3.9vw,1.05rem);line-height:1.45;animation:in 1.2s both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.dots{display:flex;gap:7px;justify-content:center;margin-bottom:14px}
.dots i{width:8px;height:8px;border-radius:9px;background:rgba(255,255,255,.22);transition:.6s}
.dots i.on{background:var(--flame);width:24px;box-shadow:0 0 10px var(--flame)}
button{font:inherit;cursor:pointer;border:0;border-radius:99px;padding:14px 30px;min-height:48px;font-weight:600;font-size:1.05rem;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:3px solid var(--flame);outline-offset:3px}
.cta{background:linear-gradient(135deg,var(--flame),var(--ember));color:#2a0e00;box-shadow:0 0 28px rgba(255,140,40,.5)}
.ghost{background:rgba(255,236,200,.1);color:var(--ink);border:1px solid var(--line)}
#end{display:none;gap:10px;justify-content:center;flex-wrap:wrap}
.wish{position:fixed;left:50%;top:15%;transform:translate(-50%,-50%) scale(.2);opacity:0;text-align:center;pointer-events:none;width:94vw}
.wish h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(2.8rem,13vw,6rem);margin:0;line-height:1.05;color:#ffd36a;text-shadow:0 0 34px rgba(255,150,40,.95),0 4px 18px #000}
.wish span{display:block;font-size:clamp(1.15rem,4.5vw,1.8rem);color:#fff3dc;margin-top:8px;text-shadow:0 2px 14px #000}
.wish.on{animation:pp 1.8s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pp{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--flame);color:#2a0e00;padding:9px 18px;border-radius:99px;font-weight:600;opacity:0;transition:.4s;pointer-events:none}
.toast.on{opacity:1}
#end button{flex:1 1 140px;max-width:220px}
@media (max-width:380px){button{padding:13px 20px}.panel{padding-top:56px}}
@media (max-height:520px) and (orientation:landscape){.panel{padding-top:26px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}h1{font-size:1.5rem}p{margin:3px auto 8px;font-size:.9rem}.dots{margin-bottom:8px}button{padding:9px 24px;min-height:40px}.toast{bottom:80px}.wish{top:22%}.wish h2{font-size:2.6rem}.wish span{font-size:1rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.wish.on{opacity:1;transform:translate(-50%,-50%)}}
</style>
</head>

</div>
